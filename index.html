<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&display=swap" rel="stylesheet">

<title>Mensaje</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#fae1dd;
    font-family:"DM Serif Text", serif;
    text-align:center;
}

/* FRASE */

.frase{
    font-size:32px;
    max-width:600px;
    line-height:1.6;
    padding:20px;
}

/* IMAGEN ABAJO DERECHA */

.imagen{
    position:fixed;
    bottom:20px;
    right:20px;
}

.imagen img{
    width:150px;
    height:auto;
}

</style>
</head>

<body>

<h1>¡Yeimy! ❤️</h1>

<div class="frase">
Me enseñaron que los números eran infinitos,  
y lo comprobé con lo que siento por ti.  

Con usted todo se siente especial.  
Me encanta lo bien que me siento con usted.  
Es alguien realmente increíble.
</div>

<!-- AUDIO AUTOMÁTICO -->
<audio autoplay loop>
<source src="audio.mp3" type="audio/mpeg">
</audio>

<!-- ESPACIO PARA IMAGEN -->
<div class="imagen">
<img src="imagen.png" alt="imagen">
</div>

</body>
</html>

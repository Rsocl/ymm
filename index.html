<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&display=swap" rel="stylesheet">

<title>ymm</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#fae1dd;
    font-family:"DM Serif Text", serif;
    text-align:center;
}

.frase{
    font-size:28px;
    max-width:600px;
    line-height:1.6;
    padding:20px;
}

.imagen{
    position:fixed;
    bottom:20px;
    right:20px;
}

.imagen img{
    width:170px;
}

</style>
</head>

<body>

<h1>¡Yeimy! ❤️</h1>

<div class="frase">
Me enseñaron que los números eran infinitos, y lo comprobé con lo que siento por ti.  
Con usted todo se siente especial.  
Me encanta lo bien que me siento con usted.  
Es alguien realmente increíble.
</div>

<!-- IMAGEN DESDE GITHUB -->
<div class="imagen">
<img src="https://raw.githubusercontent.com/Rsocl/ymm/main/imagen.png" alt="imagen">
</div>

<script>

const audioUrl = "https://raw.githubusercontent.com/Rsocl/ymm/main/perdoname.mp3";

const audio = new Audio(audioUrl);
audio.loop = true;
audio.volume = 0.5;

document.addEventListener('click', function iniciarAudio() {
    audio.play().catch(error => {
        console.log("Autoplay bloqueado por el navegador");
    });
    document.removeEventListener('click', iniciarAudio);
});

</script>

</body>
</html>
